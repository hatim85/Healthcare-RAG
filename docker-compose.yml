services:
  # ============================================================================
  # 0. Nginx Reverse Proxy (SSL Termination, Security Headers, Rate Shield)
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: healthcare-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - logs_data:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - healthcare-net

  # ============================================================================
  # 1. FastAPI Application Server
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-rag-api
    restart: unless-stopped
    command: ["api"]
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - LITELLM_API_BASE=${LITELLM_API_BASE:-http://litellm:4000}
      - LITELLM_MCP_URL=${LITELLM_MCP_URL:-http://litellm:4000/mcp}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_VIRTUAL_KEY=${LITELLM_VIRTUAL_KEY}
      - LITELLM_MODEL=${LITELLM_MODEL}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - HEALTHCARE_MCP_URL=${HEALTHCARE_MCP_URL:-http://api:8000/mcp}
      - MCP_CLIENTS_ENABLED=${MCP_CLIENTS_ENABLED:-true}
      - MCP_LITELLM_ENABLED=${MCP_LITELLM_ENABLED:-true}
      - MCP_LANGFUSE_ENABLED=${MCP_LANGFUSE_ENABLED:-true}
      - MCP_QDRANT_ENABLED=${MCP_QDRANT_ENABLED:-true}
      - MCP_FIRECRAWL_ENABLED=${MCP_FIRECRAWL_ENABLED:-true}
      - MCP_GROQ_ENABLED=${MCP_GROQ_ENABLED:-true}
      - MCP_REDIS_ENABLED=${MCP_REDIS_ENABLED:-true}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
    volumes:
      - ./app:/app/app:ro
      - ./scripts/entrypoint.sh:/app/scripts/entrypoint.sh:ro
      - uploads_data:/app/data/uploads
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - healthcare-net

  # ============================================================================
  # 2. Celery Distributed Ingestion Worker
  # ============================================================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-celery-worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ENVIRONMENT=${ENVIRONMENT}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
      - LITELLM_API_BASE=${LITELLM_API_BASE:-http://litellm:4000}
      - LITELLM_MCP_URL=${LITELLM_MCP_URL:-http://litellm:4000/mcp}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_VIRTUAL_KEY=${LITELLM_VIRTUAL_KEY}
      - LITELLM_MODEL=${LITELLM_MODEL}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - HEALTHCARE_MCP_URL=${HEALTHCARE_MCP_URL:-http://api:8000/mcp}
      - MCP_CLIENTS_ENABLED=${MCP_CLIENTS_ENABLED:-true}
      - MCP_LITELLM_ENABLED=${MCP_LITELLM_ENABLED:-true}
      - MCP_LANGFUSE_ENABLED=${MCP_LANGFUSE_ENABLED:-true}
      - MCP_QDRANT_ENABLED=${MCP_QDRANT_ENABLED:-true}
      - MCP_FIRECRAWL_ENABLED=${MCP_FIRECRAWL_ENABLED:-true}
      - MCP_GROQ_ENABLED=${MCP_GROQ_ENABLED:-true}
      - MCP_REDIS_ENABLED=${MCP_REDIS_ENABLED:-true}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
    volumes:
      - ./app:/app/app:ro
      - ./scripts/entrypoint.sh:/app/scripts/entrypoint.sh:ro
      - uploads_data:/app/data/uploads
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && grep -q celery /proc/1/cmdline || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - healthcare-net

  # ============================================================================
  # 3. Redis (Local Dev — use 'docker compose --profile local' to start)
  #    Production .env points to Redis Cloud; this is unused by default.
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: healthcare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - healthcare-net
    profiles:
      - local

  # ============================================================================
  # 4. Qdrant Vector Search (Local Dev — use 'docker compose --profile local')
  #    Production .env points to Qdrant Cloud; this is unused by default.
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: healthcare-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthcare-net
    profiles:
      - local

  # ============================================================================
  # 5. Langfuse Tracing Server (Optional Self-Hosted Observability UI)
  #    Only needed if NOT using Langfuse Cloud. Start with:
  #    docker compose --profile langfuse up
  # ============================================================================
  langfuse-server:
    image: langfuse/langfuse:2
    container_name: healthcare-langfuse
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@db:5432/litellm
      - NEXTAUTH_SECRET=${LANGFUSE_SECRET_KEY}
      - NEXTAUTH_URL=${LANGFUSE_HOST_URL}
      - SALT=${LANGFUSE_SALT}
      - TELEMETRY_ENABLED=false
    networks:
      - healthcare-net
    profiles:
      - langfuse

volumes:
  redis_data:
  qdrant_data:
  uploads_data:
  logs_data:

networks:
  healthcare-net:
    name: healthcare-net
    external: true
